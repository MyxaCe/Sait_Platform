# Локальная сборка/проверка (Docker Desktop) и основа для VPS-деплоя.
# Профили: `docker compose up db` — только Postgres для pnpm dev;
#          `docker compose --profile full up` — весь стек (web + relay).
#
# ВНИМАНИЕ: СЕКРЕТЫ НИЖЕ СОЖЖЕНЫ.
#
# `broker_dev_password`, `dev-cms-api-key`, `local-dev-secret`,
# `preview-dev-secret` лежат в публичной истории репозитория с августа.
# На сервере не используется ни один — там всё сгенерировано, — и
# перевыпускать нечего.
#
# Оставлены только потому, что этот файл есть самодостаточный локальный
# стенд: службам надо сойтись на одном значении, а данных в нём нет.
# Брать их куда-либо ещё нельзя НИ ПРИ КАКИХ «для теста»: временное
# остаётся. В примерах окружения их больше нет — там сказано
# сгенерировать своё.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: broker_site
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker_dev_password
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Схемы здесь больше нет (WEB-31): она в `packages/db/migrations`
      # и применяется шагом `migrate`. Монтирование оставлено, чтобы
      # объяснение в `db/init/README.md` лежало там, куда придёт тот,
      # кто станет искать схему. Postgres `.md` не исполняет.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker_site']
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции схемы — ОТДЕЛЬНЫЙ шаг, а не часть старта приложения
  # (WEB-31). Приложение, применяющее миграции само, становится вторым
  # владельцем схемы: два экземпляра, поднявшиеся разом, правили бы её
  # наперегонки. Здесь — одноразовая задача, которую запускают явно:
  #   docker compose run --rm migrate
  migrate:
    profiles: [tools, full]
    image: node:22-alpine
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      DATABASE_URL: postgres://broker:broker_dev_password@db:5432/broker_site
    command: >
      sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate &&
             pnpm install --frozen-lockfile --filter @broker/db... &&
             pnpm --filter @broker/db migrate"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      # Публичные адреса приходят ОКРУЖЕНИЕМ (WEB-22, Р-220): образ домена
      # не знает, подстановка в собранный вывод идёт при запуске.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_CABINET_URL: http://localhost:3002
      NEXT_PUBLIC_WS_URL: http://localhost:3003
      # Кому разрешено встраивать витрину (WEB-23, Р-224). Не задан —
      # никому: промах здесь даёт разрешение, а не нерабочую ссылку.
      FRAME_ANCESTORS: "'self' http://localhost:3001"
      DATABASE_URL: postgres://broker:broker_dev_password@db:5432/broker_site
      # Каталог MDS (server-side): фильтр тикера по реально стримящимся символам
      MDS_HTTP_URL: http://host.docker.internal:3003
      CMS_WEBHOOK_SECRET: local-dev-secret
      PREVIEW_SECRET: preview-dev-secret
      # Реальная CMS (репо Broker_CMS, локально на хосте :3001).
      # Если CMS не запущена — getCms уходит в фолбэк-фикстуры (штатный режим, R-06).
      CMS_API_URL: http://host.docker.internal:3001/v1
      CMS_API_KEY: dev-cms-api-key
      # Мульти-тенантная CMS: этот сайт = тенант apex-ru
      SITE_SLUG: apex-ru
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  cabinet:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/cabinet.Dockerfile
    environment:
      # Каталог MDS (server-side) для модуля «Рынки»
      MDS_HTTP_URL: http://host.docker.internal:3003
      # Браузерный origin MDS для сервера (иконки в SSR модуля «Рынки»)
      NEXT_PUBLIC_WS_URL: http://localhost:3003
      DATABASE_URL: postgres://broker:broker_dev_password@db:5432/broker_site
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      # Хром из CMS (ADR-025): бренд/футер того же тенанта, что у сайта
      CMS_API_URL: http://host.docker.internal:3001/v1
      CMS_API_KEY: dev-cms-api-key
      # Терминал (dev-origin от их команды; iframe грузит браузер — localhost ок)
      NEXT_PUBLIC_TERMINAL_URL: http://localhost:8888
      # Тот же терминал, но адрес СЕРВЕРНЫЙ: историю сделок кабинет
      # читает сам, из контейнера, и браузерный localhost ведёт туда
      # в никуда (CAB-09). Пара та же, что у MDS: NEXT_PUBLIC_* для
      # браузера, обычная переменная для процесса.
      TERMINAL_HTTP_URL: http://host.docker.internal:8888
      SITE_SLUG: apex-ru
      # SSO для терминала (ADR-023). Значение НЕ живёт в репозитории: это
      # приватный ключ подписи токенов доступа, а репозиторий публичный.
      # Берётся из `.env` рядом с этим файлом (`.env` в .gitignore).
      # Как сгенерировать dev-ключ — apps/cabinet/.env.example.
      # Не задан → cabinet поднимется, но /api/sso/jwks отдаст 503
      # sso_not_configured. Это честный отказ, а не тихая подмена.
      SSO_PRIVATE_KEY_B64: ${SSO_PRIVATE_KEY_B64:-}
    ports:
      - '3002:3002'
    volumes:
      - cabinet-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  relay:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    environment:
      DATABASE_URL: postgres://broker:broker_dev_password@db:5432/broker_site
      # BUS_URL: amqp://...  ← реквизиты шины платформы (созвон §10);
      # без него релей публикует в лог (LogPublisher) — контур проверяем уже сейчас
    depends_on:
      db:
        condition: service_healthy

  # Консюмер событий терминала → проекция demo_accounts/позиции/сделки (Т3).
  # Без BUS_URL простаивает (NullSubscriber); подключение шины = env.
  consumer:
    profiles: [full]
    build:
      context: .
      dockerfile: docker/consumer.Dockerfile
    environment:
      DATABASE_URL: postgres://broker:broker_dev_password@db:5432/broker_site
      SITE_SLUG: apex-ru
      # BUS_URL: amqp://...  ← кредлы platform.events (созвон §10 с CRM)
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  cabinet-uploads:
