name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SITE_SLUG: apex-ru
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_WS_URL: http://127.0.0.1:55494

      - name: Bundle size report (non-blocking, Р-031)
        run: node scripts/check-bundle-budget.mjs

      - name: Install Playwright Chromium
        run: |
          pnpm --filter @broker/web exec playwright install chromium
          for i in 1 2 3; do
            pnpm --filter @broker/web exec playwright install-deps chromium && break
            echo "install-deps: попытка $i не удалась"; sleep 20
          done || true

      - name: E2E tests (production build)
        run: pnpm --filter @broker/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
