name: CI

# ТРИГГЕР: пуш в ЛЮБУЮ ветку (решение Р-031).
#
# Было `branches: [main]` — и это значило, что механизм существует и не
# срабатывает: с 27 июля не выполнилось ни одного прогона, потому что работа
# идёт на ветках задач, а в `main` вливают уже проверенное глазами. Восемь
# коммитов пяти задач не проходили CI вообще.
#
# Сознательно принятая цена: ветка, на которую открыт PR внутри этого же
# репозитория, прогоняется дважды (push + pull_request). Пропущенный прогон
# стоит дороже лишнего: именно пропуск и стоил нам двух с половиной месяцев.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Версию pnpm экшен берёт из поля packageManager в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # НЕБЛОКИРУЮЩИЙ отчёт (Р-031): бюджет превышен на 32 маршрутах из 34,
      # худший 215,9 КБ против 170,9 — замерено на чистом дереве, то есть
      # накоплено, а не принесено свежими правками. Блокирующий гейт здесь даёт
      # вечно красный CI, а гейт, который невозможно удовлетворить, отключают —
      # это мы уже проходили с гейтом комплаенса.
      #
      # Отчёт не притворяется пройденной проверкой: при превышении печатает
      # ПРЕВЫШЕНИЕ с числами и кладёт их в сводку прогона.
      #
      # ДОЛГ: вернуть блокировку — `BUNDLE_BUDGET_ENFORCE: '1'` одной строкой,
      # когда превышение опустится до нуля маршрутов либо бюджет будет
      # пересмотрен осознанно и с обоснованием.
      - name: Bundle size report (non-blocking, Р-031)
        run: node scripts/check-bundle-budget.mjs

      - name: Install Playwright Chromium
        run: pnpm --filter @broker/web exec playwright install --with-deps chromium

      - name: E2E tests (production build)
        run: pnpm --filter @broker/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
