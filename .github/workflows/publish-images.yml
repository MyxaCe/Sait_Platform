name: Образы

# ПУБЛИКАЦИЯ ОБРАЗОВ · OPS-23, зона `deploy`.
#
# Собираем здесь, сервер только скачивает. Причина записана штабом и повторена
# тут, чтобы её не «оптимизировали»: сборка на сервере не даёт ответить, какая
# ревизия работает (три поколения прод-CRM с тегом `latest`), и стоит десять
# гигабайт на машине, где их нет.
#
# ТЕГ — ПОЛНЫЙ ХЕШ КОММИТА И НИЧЕГО БОЛЬШЕ.
# `latest` не заводится вовсе. Это не стиль, а явный запрет платформы, и он
# проверяется механизмом (шаг «Запрет latest»), а не доверием к читателю.
#
# ТРИ РАЗНЫХ ВОПРОСА, КОТОРЫЕ МЫ ОДНАЖДЫ СКЛЕИЛИ В ОДИН (OPS-05):
#   какие байты работают      → digest, печатается в итог прогона;
#   можно ли воспроизвести    → неизменяемый тег = хеш коммита;
#   из какого исходника собран→ метка org.opencontainers.image.revision.
# Поэтому меток и проверок три, а не одна.
#
# ТРИГГЕР — ПУШ В ЛЮБУЮ ВЕТКУ, БЕЗ ФИЛЬТРА ПО ПУТЯМ. Цена названа: образы
# собираются и на коммите, который правит один документ. Фильтр по путям
# дешевле, но он оставил бы коммиты без образа — а деплой адресуется коммитом,
# и «для этой ревизии образа нет» мы уже проходили.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Отмена на лету здесь запрещена: прерванная публикация оставила бы тег
  # наполовину загруженным, а тег у нас неизменяемый и второй раз не пишется.
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Собрать и опубликовать · ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: broker-web
            dockerfile: docker/web.Dockerfile
            # Публичные адреса вшиваются в клиентский бандл на СБОРКЕ (Р-129).
            # Значения сюда НЕ вписываются: домен живёт в одном месте, в
            # `.env` обратного прокси на сервере. Здесь — только ссылка на
            # переменную репозитория, и пока она пуста, образ собирается с
            # умолчаниями Dockerfile и ОБЪЯВЛЯЕТ ЭТО меткой и предупреждением.
            build-args: |
              FRAME_ANCESTORS=${{ vars.FRAME_ANCESTORS }}
              NEXT_PUBLIC_CABINET_URL=${{ vars.NEXT_PUBLIC_CABINET_URL }}
              NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
              NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            public-args: FRAME_ANCESTORS NEXT_PUBLIC_CABINET_URL NEXT_PUBLIC_WS_URL
          - image: broker-cabinet
            dockerfile: docker/cabinet.Dockerfile
            build-args: |
              NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
              NEXT_PUBLIC_TERMINAL_URL=${{ vars.NEXT_PUBLIC_TERMINAL_URL }}
              NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            public-args: NEXT_PUBLIC_WS_URL NEXT_PUBLIC_TERMINAL_URL
          # У релея и консюмера аргументов сборки нет вовсе — они
          # окружение-агностичны, и это их свойство, а не недосмотр.
          - image: broker-relay
            dockerfile: docker/relay.Dockerfile
            build-args: ''
            public-args: ''
          - image: broker-consumer
            dockerfile: docker/consumer.Dockerfile
            build-args: ''
            public-args: ''
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа и тег
        id: ref
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner}/${IMAGE}"
          tag="${{ github.sha }}"

          # ГЕЙТ ФОРМЫ ТЕГА. Работает над вычисленным значением, а не над
          # текстом файла: любой плавающий тег, откуда бы он ни взялся,
          # не пройдёт сюда.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::тег «$tag» не является полным хешем коммита; плавающие теги запрещены"
            exit 1
          fi

          echo "ref=$ref"   >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Два разных запрета, и их нельзя сливать в один шаг: первый про то,
      # что `latest` не должен существовать НИКОГДА, второй про то, что
      # существующий тег не переписывается. Разные причины — разные починки.
      - name: Запрет latest
        run: |
          set -uo pipefail
          out=$(docker manifest inspect "$IMAGE_REF:latest" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::в реестре есть $IMAGE_REF:latest — плавающий тег запрещён платформой, удалите версию пакета"
            exit 1
          fi
          echo "latest отсутствует. Ответ реестра (печатаем целиком, чтобы отказ прав не выглядел отсутствием тега):"
          echo "$out"

      - name: Неизменяемость тега
        run: |
          set -uo pipefail
          out=$(docker manifest inspect "$IMAGE_REF:$IMAGE_TAG" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::$IMAGE_REF:$IMAGE_TAG уже опубликован. Тег неизменяем: перезапись запрещена. Нужен новый образ — нужен новый коммит."
            echo "$out" | head -20
            exit 1
          fi
          echo "тега ещё нет, публикуем. Ответ реестра:"
          echo "$out"

      - name: Охват публичных адресов
        id: public
        env:
          PUBLIC_ARGS: ${{ matrix.public-args }}
          FRAME_ANCESTORS: ${{ vars.FRAME_ANCESTORS }}
          NEXT_PUBLIC_CABINET_URL: ${{ vars.NEXT_PUBLIC_CABINET_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_TERMINAL_URL: ${{ vars.NEXT_PUBLIC_TERMINAL_URL }}
        run: |
          set -euo pipefail
          # «Не задано» — это утверждение о том, чего мы не знаем, и оно обязано
          # быть видно снаружи образа. Поэтому состояние едет МЕТКОЙ, а не
          # только строкой в логе прогона, который через неделю никто не
          # откроет. Шаг НЕ красный: пустые адреса законны для сборки,
          # непригодной для прода, и решение о домене принимает штаб.
          missing=0; total=0
          for name in $PUBLIC_ARGS; do
            total=$((total + 1))
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              missing=$((missing + 1))
              echo "::warning::$name не задан — в образ уйдёт умолчание Dockerfile"
            fi
          done
          if [ "$total" -eq 0 ]; then
            state=none
            echo "образ окружение-агностичен: публичных адресов на сборке нет"
          elif [ "$missing" -eq 0 ]; then
            state=set
            echo "осмотрено $total адресов, все заданы"
          else
            state=unset
            echo "::warning::осмотрено $total адресов, не задано $missing — ОБРАЗ НЕ ПРИГОДЕН ДЛЯ ПРОДА"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Собираем в локальный демон, а НЕ сразу в реестр: метку ревизии надо
      # проверить до публикации. Проверка после пуша означала бы, что красный
      # прогон оставляет в реестре тег, которому нельзя верить.
      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          provenance: false
          tags: ${{ steps.ref.outputs.ref }}:${{ steps.ref.outputs.tag }}
          build-args: ${{ matrix['build-args'] }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            com.broker.public-addresses=${{ steps.public.outputs.state }}
            com.broker.built-by=${{ github.workflow }}/${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Метка ревизии стоит и совпадает с коммитом
        run: |
          set -euo pipefail
          got=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF:$IMAGE_TAG")
          if [ "$got" != "$IMAGE_TAG" ]; then
            echo "::error::метка ревизии «$got» не равна коммиту «$IMAGE_TAG» — из чего собран образ, ответить нечем"
            exit 1
          fi
          echo "revision=$got"
          docker inspect --format '{{json .Config.Labels}}' "$IMAGE_REF:$IMAGE_TAG"

      - name: Публикация
        run: docker push "$IMAGE_REF:$IMAGE_TAG"

      - name: Итог
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE_REF:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| образ | \`$IMAGE_REF\` |"
            echo "| тег (неизменяемый) | \`$IMAGE_TAG\` |"
            echo "| digest | \`$digest\` |"
            echo "| публичные адреса | \`${{ steps.public.outputs.state }}\` |"
            echo ""
            echo "Скачать: \`docker pull $IMAGE_REF@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pull:
    name: Скачать обратно · ${{ matrix.image }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [broker-web, broker-cabinet, broker-relay, broker-consumer]
    steps:
      # Отдельное задание на чистом раннере — иначе «скачивается» проверялось бы
      # на машине, где образ уже лежит в демоне с момента сборки. Проверка
      # обязана ломать именно то, что проверяет.
      - name: Имя образа
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REF=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      # НЕ ГЕЙТ, И ЭТО СКАЗАНО ВСЛУХ. Публичность пакета — решение владельца:
      # публичный пакет сервер тянет без ключа, приватный требует токена на
      # чтение. Оба состояния законны, и шаг сообщает, какое сейчас, вместо
      # того чтобы молчать или краснеть не по делу. Красным это станет в
      # стадии 2, когда выбор будет сделан.
      - name: Видимость пакета — анонимная попытка
        run: |
          set -uo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker pull "$IMAGE_REF:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ПАКЕТ ПУБЛИЧНЫЙ: сервер скачает без ключа"
            echo "- \`${{ matrix.image }}\` — **публичный**" >> "$GITHUB_STEP_SUMMARY"
            docker rmi "$IMAGE_REF:$IMAGE_TAG" >/dev/null 2>&1 || true
          else
            echo "ПАКЕТ ПРИВАТНЫЙ: серверу понадобится токен на чтение пакетов"
            echo "- \`${{ matrix.image }}\` — **приватный**, серверу нужен токен" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Скачать и сверить ревизию
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF:$IMAGE_TAG"
          got=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF:$IMAGE_TAG")
          if [ "$got" != "$IMAGE_TAG" ]; then
            echo "::error::скачанный образ собран из «$got», а запрашивали «$IMAGE_TAG»"
            exit 1
          fi
          echo "скачан $IMAGE_REF:$IMAGE_TAG, ревизия сходится"
